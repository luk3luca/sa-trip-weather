name: Weekly data update + deploy

on:
  push:
    branches: [main]
    paths-ignore: ['public/data/weather.json'] # il commit del bot non riattiva il workflow
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC — refresh settimanale dei dati
    - cron: "0 5 8-19 9 *" # 8–19 settembre, ogni giorno 05:00 UTC — run-up + viaggio
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- DATA PIPELINE: aggiorna lo snapshot meteo (ECMWF, GFS, GEM, JMA, ICON) ----
      # Sicurezza: il fetch valida in memoria e scrive con sostituzione atomica (tmp+rename):
      # se qualcosa va storto, public/data/weather.json resta quello precedente e il
      # deploy prosegue con l'ultimo snapshot buono.
      - name: Fetch weather snapshot (atomic, validate before replace)
        run: |
          npm run fetch || echo "::warning::fetch fallito: mantenuto lo snapshot precedente"

      # Gate di integrità sul file su disco: se fallisce, niente commit e niente deploy
      # (GitHub Pages mantiene l'ultimo deploy valido — il sito non va mai offline).
      - name: Validate weather.json (gate)
        run: npm run validate
      # ---- END DATA PIPELINE ----

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/weather.json
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "[bot] weekly weather snapshot refresh $(date -u +%F)"
            git push
          fi

      - name: Build static site
        run: npm run build # produce dist/ (base './' già configurato in vite.config.ts)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4